name: Keep backend awake

# Render's free tier sleeps the backend after ~15 minutes idle, and the next
# visitor then waits ~50s for it to wake.
#
# A plain "*/5 * * * *" cron does NOT work here: GitHub heavily deprioritizes
# scheduled runs on free public repos and was firing this every 45-85 minutes,
# so the backend slept most of the day. Instead, one run stays alive for ~5.5
# hours pinging every 5 minutes, and we schedule it every 5 hours so runs
# overlap. Even an hour of GitHub delay leaves no gap.
#
# Public repos get unlimited Actions minutes, so the long runtime is free.

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never let a delayed run pile up behind the previous one.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Ping every 5 minutes for ~5.5 hours
        run: |
          URL="https://lightapi-ufl5.onrender.com/api/directory/categories"
          END=$(( $(date +%s) + 19800 ))   # 5.5 hours from now
          while [ "$(date +%s)" -lt "$END" ]; do
            CODE=$(curl -sS --max-time 120 -o /dev/null -w '%{http_code} %{time_total}' "$URL" || echo "000 timeout")
            echo "$(date -u +%H:%M:%S) -> $CODE"
            sleep 300
          done
